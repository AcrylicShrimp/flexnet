[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
ed25519-dalek = "3.0.0-pre.6"
flexnet-chain = { path = "crates/flexnet-chain" }
flexnet-codec = { path = "crates/flexnet-codec" }
flexnet-consensus = { path = "crates/flexnet-consensus" }
flexnet-consensus-v2 = { path = "crates/flexnet-consensus-v2" }
hex = "0.4"
parking_lot = "0.12"
rand = "0.10"
sha2 = "0.11"
thiserror = "2"
tokio = "1"
zeroize = "1"
